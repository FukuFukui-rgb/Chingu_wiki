<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>とろぽと愉快な仲間たちのwiki</title>
  <meta name="robots" content="noindex">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style type="text/css">
    body { 
      background-color: #595959;
      margin: 8px;
    }
    h1 {
      font-size: 25px;
      color: #ffffff;
      border: 1px solid #ffffff;
      padding: 15px 15px;
      margin-bottom: 10px;
    }
    p {
      color: #ffffff;
    }
    .sushi {
      flex: 1;
      margin-left: 0px;
      padding: 15px;
      border: 1px solid #ffffff;
      color: #ffffff;
      box-sizing: border-box;
      min-width: 0;
    }
    .omumu {
      margin-right: 10px;
      padding: 10px;
      color: #ffffff;
      width: 140px;
      flex-shrink: 0; 
      border: 1px solid #ffffff;
      box-sizing: border-box;
    }
    a {
      color: #FFD2A5;
    }

    .comment-item {
      margin-bottom: 15px;
    }
    .comment-info {
      font-size: 0.85rem;
      margin-bottom: 8px;
    }
    .c-name {
      font-weight: bold;
      margin-right: 12px;
    }
    .c-id {
      color: #ccc;
      margin-right: 12px;
      font-family: monospace;
    }
    .c-time {
      color: #ccc;
    }
    .c-text {
      font-size: 0.95rem;
      margin-bottom: 8px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .c-actions {
      text-align: right;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }
    .action-link {
      color: #fff;
      cursor: pointer;
      margin-left: 12px;
      text-decoration: underline;
    }
    .comment-line {
      border: none;
      border-top: 1px dashed #aaa;
      margin: 15px 0;
    }

    .comment-form-box {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid #888;
      width: 100%;
      box-sizing: border-box;
    }
    .form-group {
      margin-bottom: 15px;
      width: 100%;
    }
    
    .form-group input[type="text"] {
      width: 220px;
      max-width: 100%;
      padding: 10px;
      background: #ffffff;
      border: 1px solid #777;
      box-sizing: border-box;
      font-size: 0.95rem;
      color: #000000;
      display: block;
    }

    .form-group textarea {
      width: 100%;
      padding: 10px;
      background: #ffffff;
      border: 1px solid #777;
      box-sizing: border-box;
      font-size: 0.95rem;
      color: #000000;
      display: block;
      resize: vertical;
    }

    .image-upload-btn {
      background: #333333;
      color: #ffffff;
      border: none;
      padding: 8px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 4px;
      display: inline-block;
    }

    .image-clear-btn {
      background: #cc0000;
      color: #ffffff;
      border: none;
      padding: 6px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-left: 8px;
      display: none;
      border-radius: 4px;
    }

    .image-name-text {
      font-size: 0.8rem;
      color: #FFD2A5;
      margin-left: 8px;
    }
    .form-submit {
      text-align: right;
      margin-top: 10px;
    }

    .submit-btn {
      background-color: #888888;
      color: #dddddd;
      border: none;
      padding: 10px 24px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: not-allowed;
      border-radius: 4px;
      display: inline-block;
    }

    .submit-btn:not(:disabled) {
      background-color: #489e00;
      color: #ffffff;
      border: none;
      cursor: pointer;
    }
  </style>

  <link rel="icon" href="サイトアイコン.png" type="image/png">
  <link rel="apple-touch-icon" href="サイトアイコン.png">
</head>

<body>

  <h1 style="text-align: center;">■コメント</h1>

  <div style="display: flex;">
    
    <p class="omumu">メニュー<br><br>
      <a href="とろぽと愉快な仲間たちのwiki.html">・ホーム</a><br>
      <a href="とろぽについて.html">・とろぽについて</a><br>
      <a href="仲間たち.html">・仲間たち</a><br>
      <a href="ギャラリー.html">・ギャラリー</a><br>
      <a href="とろぽ史.html">・とろぽ史（おもな出来事）</a>
    </p>

    <div class="sushi">
      
      <div id="comment-list"></div>

      <div class="comment-form-box">
        <div class="form-group">
          <input type="text" id="input-name" placeholder="お名前（必須）" oninput="checkForm()">
        </div>
        <div class="form-group">
          <textarea id="input-text" placeholder="コメント（必須）" rows="4" oninput="checkForm()"></textarea>
        </div>
        
        <div class="form-group">
          <input type="file" id="input-image" accept="image/*" style="display:none;" onchange="previewImage(this)">
          <button type="button" onclick="document.getElementById('input-image').click()" class="image-upload-btn"> 画像を選択 (任意/1枚まで)</button>
          <span id="image-name" class="image-name-text"></span>
          <button type="button" id="clear-image-btn" onclick="clearImage()" class="image-clear-btn">✕ 添付を削除</button>
        </div>

        <div class="form-submit">
          <button id="submit-btn" class="submit-btn" onclick="handleSubmit()" disabled>コメントする</button>
        </div>
      </div>

    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://twxydrafbdvxjwmciyrh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3eHlkcmFmYmR2eGp3bWNpeXJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1ODUzNzMsImV4cCI6MjEwODE2MTM3M30.ke5MVDspDbKX2EnuYpfwe0OhfaaceGBqW5bBct40-Is';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    var editingCommentId = null;

    window.onload = function() {
      loadComments();
    };

    async function loadComments() {
      const { data, error } = await supabaseClient
        .from('comments')
        .select('*')
        .order('id', { ascending: true });

      if (data) {
        const commentList = document.getElementById('comment-list');
        commentList.innerHTML = '';
        data.forEach(comment => {
          addCommentToScreen(comment);
        });
      }
    }

    function addCommentToScreen(commentData) {
      const commentList = document.getElementById('comment-list');
      if (!commentList) return;
      if (document.getElementById(`comment-${commentData.id}`)) return;

      const commentHtml = `
        <div class="comment-item" id="comment-${commentData.id}">
          <div class="comment-info">
            <span class="c-name">${commentData.name || '名無し'}</span>
            <span class="c-id">ID:${commentData.id}</span>
            <span class="c-time">${commentData.created_at ? new Date(commentData.created_at).toLocaleString() : ''}</span>
          </div>
          <div class="c-text">${commentData.text || ''}</div>
          <div class="c-actions">
            <span class="action-link" onclick="startEdit(${commentData.id}, '${commentData.name || ''}', '${commentData.text || ''}')">編集</span>
            <span class="action-link" onclick="confirmDelete(${commentData.id})">削除</span>
          </div>
          <hr class="comment-line">
        </div>
      `;
      commentList.insertAdjacentHTML('beforeend', commentHtml);
    }

    function checkForm() {
      var nameVal = document.getElementById('input-name').value;
      var textVal = document.getElementById('input-text').value;
      var btn = document.getElementById('submit-btn');
      
      if (nameVal.trim() !== '' && textVal.trim() !== '') {
        btn.disabled = false;
      } else {
        btn.disabled = true;
      }
    }

    function previewImage(input) {
      var nameSpan = document.getElementById('image-name');
      var clearBtn = document.getElementById('clear-image-btn');
      if (input.files && input.files[0]) {
        nameSpan.textContent = input.files[0].name;
        clearBtn.style.display = 'inline-block';
      } else {
        clearImage();
      }
    }

    function clearImage() {
      var fileInput = document.getElementById('input-image');
      var nameSpan = document.getElementById('image-name');
      var clearBtn = document.getElementById('clear-image-btn');
      fileInput.value = '';
      nameSpan.textContent = '';
      clearBtn.style.display = 'none';
    }

    function startEdit(commentId, currentName, currentText) {
      editingCommentId = commentId;
      document.getElementById('input-name').value = currentName;
      document.getElementById('input-text').value = currentText;
      
      var btn = document.getElementById('submit-btn');
      btn.textContent = '編集する';
      btn.disabled = false;
      document.getElementById('input-name').focus();
    }

    async function confirmDelete(commentId) {
      if (confirm("本当に削除しますか？")) {
        const { error } = await supabaseClient
          .from('comments')
          .delete()
          .eq('id', commentId);

        if (!error) {
          const target = document.getElementById(`comment-${commentId}`);
          if (target) target.remove();
          alert("削除しました。");
        }
      }
    }

    async function handleSubmit() {
      var nameVal = document.getElementById('input-name').value;
      var textVal = document.getElementById('input-text').value;

      if (editingCommentId === null) {
        const { error } = await supabaseClient
          .from('comments')
          .insert([{ name: nameVal, text: textVal }]);

        if (error) {
          alert("送信に失敗しました");
          return;
        }
      } else {
        const { error } = await supabaseClient
          .from('comments')
          .update({ name: nameVal, text: textVal })
          .eq('id', editingCommentId);

        if (!error) {
          alert("コメントを更新しました！");
          const target = document.getElementById(`comment-${editingCommentId}`);
          if (target) {
            target.querySelector('.c-name').textContent = nameVal;
            target.querySelector('.c-text').textContent = textVal;
          }
          editingCommentId = null;
          document.getElementById('submit-btn').textContent = 'コメントする';
        }
      }
      
      document.getElementById('input-name').value = '';
      document.getElementById('input-text').value = '';
      clearImage();
      checkForm();
    }

    supabaseClient
      .channel('comment-changes')
      .on(
        'postgres_changes', 
        { event: 'INSERT', schema: 'public', table: 'comments' }, 
        (payload) => {
          addCommentToScreen(payload.new);
        }
      )
      .subscribe();

    loadComments();


  </script>

</body>

</html>
