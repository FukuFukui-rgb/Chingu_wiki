<script>
    function toggleNextImage(button) {
        const container = button.nextElementSibling;
        const icon = button.querySelector('.icon');
        
        container.classList.toggle('open');
        
        if (container.classList.contains('open')) {
            icon.textContent = '-';
        } else {
            icon.textContent = '+';
        }
    }
</script>
